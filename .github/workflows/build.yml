name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Find or unzip project
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)

          if [ -z "$FILE" ]; then
            while IFS= read -r ZIP; do
              echo "Trying zip: $ZIP"
              rm -rf _project
              mkdir _project
              unzip -q -o "$ZIP" -d _project < /dev/null
              FILE=$(find _project -name settings.gradle.kts | head -n 1)
              if [ -n "$FILE" ]; then
                break
              fi
            done < <(find . -iname '*.zip' -not -path './.git/*' | sort -rV)
          fi

          if [ -z "$FILE" ]; then
            echo "::error::No project found. Upload the extracted WaterBoost files, or the zip itself, to the repo."
            ls -R | head -50
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WaterBoost-APK
          path: |
            ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
