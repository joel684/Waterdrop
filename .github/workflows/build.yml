name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Finds the folder that holds settings.gradle.kts, wherever it is in the repo.
      - name: Find project folder
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No settings.gradle.kts found. Extract the zip so the project files are in the repo."
            ls -R | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Debug APK first. If this fails, the build fails.
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      # Release APK is a bonus. If it fails, you still get the debug APK.
      - name: Build release APK
        continue-on-error: true
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WaterBoost-APK
          path: |
            ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
